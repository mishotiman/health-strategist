name: Tests

# The suite is the pre-deploy gate. It runs against a real Postgres+pgvector,
# not a mock: conftest.py skips database-backed tests when no DB is reachable,
# so without a service container CI would silently run a smaller suite and still
# report green. Booting pgvector keeps sessions, tokens and the endpoint tests
# in scope.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                       # one run per branch; newer pushes win
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16   # same major version as Azure PG 16
        env:
          POSTGRES_USER: phs
          POSTGRES_PASSWORD: phs
          POSTGRES_DB: phs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phs -d phs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # localhost, not the compose hostname `db`: the service is port-mapped
      # onto the runner rather than sharing a compose network.
      DATABASE_URL: postgresql://phs:phs@localhost:5432/phs
      # conftest.py sets placeholders too, but being explicit here keeps a
      # missing-key failure from looking like a test failure.
      ANTHROPIC_API_KEY: test-key
      VOYAGE_API_KEY: test-key
      OPENAI_API_KEY: test-key
      SESSION_SECRET: test-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"       # matches the Dockerfile
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Create the schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init_db.sql

      - name: Apply migrations
        # Idempotent, and on a fresh database it baselines what init_db.sql just
        # created. Running it here is also a real test of the migration runner.
        run: python scripts/migrate.py

      - name: Run the test suite
        run: pytest -q
