services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phs
      POSTGRES_PASSWORD: phs
      POSTGRES_DB: phs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phs -d phs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Dev-only: hot-reload on file changes. The image's own CMD is the
    # production one (no --reload) — that's what runs in the cloud.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://phs:phs@db:5432/phs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
