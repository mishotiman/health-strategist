<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Health Strategist</title>
<script src="/static/marked.min.js"></script>
<style>
  :root { --bg:#0f1720; --panel:#16212e; --line:#26333f; --teal:#2dd4bf; --ink:#e6edf3; --dim:#8aa0b2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--teal); }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  #status { font-size:12px; color:var(--dim); padding:6px 20px; border-bottom:1px solid var(--line); min-height:0; transition:opacity .4s; }
  #status.ok { color:var(--teal); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:780px; width:100%; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:12px; line-height:1.55; max-width:90%; }
  .user { align-self:flex-end; background:#1f3a4d; white-space:pre-wrap; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  /* markdown inside bot messages */
  .bot > :first-child { margin-top:0; } .bot > :last-child { margin-bottom:0; }
  .bot h1,.bot h2,.bot h3 { margin:14px 0 6px; line-height:1.3; }
  .bot h1 { font-size:19px; } .bot h2 { font-size:17px; } .bot h3 { font-size:15px; }
  .bot p { margin:8px 0; }
  .bot ul,.bot ol { margin:8px 0; padding-left:22px; }
  .bot li { margin:3px 0; }
  .bot strong { color:#fff; }
  .bot a { color:var(--teal); text-decoration:none; }
  .bot a:hover { text-decoration:underline; }
  .bot code { background:#0b131b; border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:13px; }
  .bot pre { background:#0b131b; border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; }
  .bot pre code { border:none; padding:0; }
  .bot table { border-collapse:collapse; margin:10px 0; font-size:14px; display:block; overflow-x:auto; }
  .bot th,.bot td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  .bot th { background:#0d1b26; }
  .sources { align-self:flex-start; font-size:12px; color:var(--dim); margin-top:-8px; max-width:90%; }
  .sources a { color:var(--dim); }
  .sources a:hover { color:var(--teal); }
  .tools { align-self:flex-start; font-size:11px; color:var(--dim); margin-top:-8px; }
  .tools span { background:#0d2b28; color:var(--teal); border-radius:6px; padding:2px 7px; margin-right:5px; }
  form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); max-width:780px; width:100%; margin:0 auto; }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:15px; }
  input:focus { outline:none; border-color:var(--teal); }
  button { background:var(--teal); color:#04201c; border:none; border-radius:10px; padding:0 20px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .attach { background:var(--panel); border:1px solid var(--line); color:var(--dim);
            font-size:22px; line-height:1; width:46px; padding:0; flex:0 0 auto; }
  .attach:hover { border-color:var(--teal); color:var(--teal); }
  .hint { color:var(--dim); font-size:13px; text-align:center; margin:auto; max-width:520px; }
  .who { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:7px; }
  .who b { color:var(--ink); }
  .who b.demo { color:#e8c37a; }   /* amber = sample account */
  .who b.live { color:var(--teal); } /* teal = your real account */
  .authbtn { font-size:12px; padding:6px 12px; border-radius:8px; background:var(--panel);
             border:1px solid var(--line); color:var(--ink); cursor:pointer; }
  .authbtn:hover { border-color:var(--teal); }
  /* the WHOOP button plus its data-freshness note, stacked */
  .whoop-col { display:flex; flex-direction:column; gap:3px; }
  .sync-note { font-size:10px; color:var(--dim); text-align:center; line-height:1.2; }
  .sync-note[hidden] { display:none; }
  /* the living orb behind the chat. z-index:-1 paints it above the body's
     background but below all content; it never intercepts clicks. */
  /* width/height are required, not decorative: a canvas is a replaced element,
     so without them it lays out at its *bitmap* size — on a scaled display
     (dpr > 1) that overflows the viewport and drags the orb off-centre. */
  #orb { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  /* themed scrollbars */
  * { scrollbar-width: thin; scrollbar-color: #33475a transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2b3a49; border-radius:6px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#3a4f63; }
  /* onboarding modal */
  .overlay { position:fixed; inset:0; background:rgba(6,11,17,.72); display:flex;
             align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay[hidden] { display:none; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px;
           padding:22px 24px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .modal p { margin:0 0 16px; color:var(--dim); font-size:13px; }
  .modal .fields { display:flex; flex-direction:column; gap:12px; }
  .modal label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--dim); }
  .modal .row { display:flex; gap:12px; }
  .modal .row label { flex:1; }
  .modal input, .modal select, .modal textarea { background:var(--bg); border:1px solid var(--line);
           color:var(--ink); border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; width:100%; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline:none; border-color:var(--teal); }
  .modal textarea { resize:vertical; }
  .modal .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .modal .ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  .modal .ghost:hover { border-color:var(--teal); color:var(--ink); }
  /* attach menu */
  .attach-wrap { position:relative; flex:0 0 auto; display:flex; }
  .menu { position:absolute; bottom:calc(100% + 8px); left:0; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; padding:6px; min-width:190px;
          box-shadow:0 10px 30px rgba(0,0,0,.45); z-index:40; }
  .menu[hidden] { display:none; }
  .menu-item { display:flex; align-items:center; gap:9px; width:100%; background:transparent;
               border:none; color:var(--ink); padding:9px 10px; border-radius:7px; font-size:14px;
               font-weight:400; cursor:pointer; justify-content:flex-start; }
  .menu-item:hover { background:var(--line); }
  /* bloodwork manager modal */
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h2 { margin:0; font-size:18px; }
  .x { background:transparent; border:none; color:var(--dim); font-size:24px; line-height:1;
       width:auto; padding:0 4px; cursor:pointer; }
  .x:hover { color:var(--ink); }
  .bw-list { display:flex; flex-direction:column; gap:8px; max-height:42vh; overflow-y:auto; margin-bottom:12px; }
  .bw-item { display:flex; align-items:center; gap:10px; background:var(--bg);
             border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  .bw-item .nm { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bw-item .meta { color:var(--dim); font-size:12px; flex:0 0 auto; }
  .bw-item .edit { background:transparent; border:none; color:var(--dim); width:auto;
                   padding:2px 6px; font-size:15px; cursor:pointer; }
  .bw-item .edit:hover { color:var(--teal); }
  .bw-item .del { background:transparent; border:none; color:#f87171; width:auto; padding:2px 6px;
                  cursor:pointer; display:inline-flex; align-items:center; }
  .bw-item .del:hover { color:#ef4444; }
  .bw-item input.rename { flex:1; background:var(--panel); border:1px solid var(--teal);
                          color:var(--ink); border-radius:6px; padding:5px 8px; font-size:14px; }
  .bw-empty { color:var(--dim); font-size:13px; padding:10px 2px; }
  .bw-status { display:flex; align-items:center; gap:8px; min-height:18px; margin-bottom:12px; }
  .bw-msg { font-size:13px; }
  .bw-msg.ok { color:var(--teal); }
  .bw-msg.err { color:#f87171; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(45,212,191,.25);
             border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite; flex:0 0 auto; }
  .spinner[hidden] { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .modal-head h2 .fmt { font-style:italic; font-weight:400; color:var(--dim); font-size:14px; }
  .bw-foot { display:flex; align-items:center; justify-content:flex-end; gap:12px; }
  .bw-add { font-size:13px; padding:9px 15px; }
  .confirm-box { max-width:380px; }
  .confirm-box p { margin:0 0 18px; font-size:14px; line-height:1.5; }
  #confirm-ok { background:#ef4444; color:#fff; }
  #confirm-ok:hover { background:#dc2626; }
  /* brief greeting after signing in / finishing onboarding */
  #welcome { position:fixed; inset:0; background:var(--bg); z-index:60; display:none;
             align-items:center; justify-content:center; }
  #welcome.on { display:flex; animation:welcomeFade 1.9s ease forwards; }
  #welcome h2 { font-size:30px; font-weight:600; letter-spacing:-.02em; margin:0;
                animation:welcomeRise .7s cubic-bezier(.22,.61,.36,1) both; }
  #welcome .accent { color:var(--teal); }
  @keyframes welcomeFade { 0%{opacity:0} 15%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  @keyframes welcomeRise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>
<div id="bw-modal" class="overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>Add bloodwork <span class="fmt">(PDF)</span></h2>
      <button class="x" id="bw-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="bw-list" class="bw-list"></div>
    <div class="bw-status">
      <span id="bw-spinner" class="spinner" hidden></span>
      <span id="bw-msg" class="bw-msg"></span>
    </div>
    <div class="bw-foot">
      <button id="bw-add" class="bw-add" type="button">+ Add file</button>
    </div>
    <input id="bw-file" type="file" accept=".pdf,application/pdf" hidden>
  </div>
</div>
<div id="confirm-modal" class="overlay" hidden>
  <div class="modal confirm-box">
    <p id="confirm-text"></p>
    <div class="actions">
      <button id="confirm-cancel" class="ghost" type="button">Cancel</button>
      <button id="confirm-ok" type="button">Delete</button>
    </div>
  </div>
</div>
<div id="signin-modal" class="overlay" hidden>
  <div class="modal confirm-box">
    <h2>You'll need an account</h2>
    <p id="signin-text"></p>
    <div class="actions">
      <button id="signin-cancel" class="ghost" type="button">Keep looking around</button>
      <button id="signin-go" type="button">Log in</button>
    </div>
  </div>
</div>
<header>
  <span class="dot"></span>
  <h1>Personal Health Strategist</h1>
  <span class="sub"></span>
  <span id="who" class="who"></span>
  <span class="whoop-col">
    <button id="whoopbtn" class="authbtn" type="button"></button>
    <span id="whoop-sync" class="sync-note" hidden></span>
  </span>
  <button id="acctbtn" class="authbtn" type="button"></button>
</header>
<div id="welcome"><h2>Welcome to <span class="accent">PHS</span></h2></div>
<div id="status"></div>

<div id="chat">
  <div class="hint">Ask about your training, recovery, sleep, supplements, or bloodwork.<br>
  The agent reads your WHOOP + lab data and cites peer-reviewed research.</div>
</div>

<form id="form">
  <div class="attach-wrap">
    <button id="attach" type="button" class="attach" title="Add bloodwork">+</button>
    <div id="attach-menu" class="menu" hidden>
      <button type="button" class="menu-item" id="menu-add-bw">🩸 Add bloodwork</button>
    </div>
  </div>
  <input id="input" autocomplete="off" placeholder="Ask about your health, training, recovery, sleep, or bloodwork…" />
  <button id="send" type="submit">Send</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const who = document.getElementById('who');
  const whoopbtn = document.getElementById('whoopbtn');
  const whoopSync = document.getElementById('whoop-sync');
  const acctbtn = document.getElementById('acctbtn');

  // One-shot query flags, read once and then cleared from the URL so a refresh
  // doesn't replay them. Captured here, at the top, because the greeting has to
  // fire BEFORE any awaited boot work: it used to run after the WHOOP sync, so a
  // slow sync made it appear a second late, over an already-visible chat.
  const bootParams = new URLSearchParams(location.search);
  if (bootParams.toString()) window.history.replaceState({}, '', '/');
  if (bootParams.get('welcome') === '1') playWelcome();

  // Guests ("Try Health Strategist now") keep nothing: no transcript, no thread
  // id, no localStorage at all. `persist` is set once /me says who we are.
  let persist = false;
  let threadId = null;
  let history = [];

  function loadHistory() { try { return JSON.parse(localStorage.getItem('phs_chat')) || []; } catch (e) { return []; } }
  function saveHistory() {
    if (!persist) return;
    try { localStorage.setItem('phs_chat', JSON.stringify(history.slice(-60))); } catch (e) {}
  }
  function clearChat() { try { localStorage.removeItem('phs_chat'); localStorage.removeItem('phs_thread'); } catch (e) {} }

  marked.setOptions({ breaks: true });
  // Disable Markdown strikethrough: the agent writes "~" for "approximately"
  // (e.g. "~30 ng/mL"), and GFM would otherwise read a pair of tildes as
  // strikethrough and cross out the text between them. Tables/links unaffected.
  marked.use({ tokenizer: { del() {} } });

  // ---- how fresh is the WHOOP data? ---------------------------------------
  // Rendered from the stored timestamp rather than a counter, so it stays right
  // across tab sleeps and needs no network call to age on screen.
  const RTF = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  function relativeTime(iso) {
    const secs = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (!Number.isFinite(secs)) return null;
    if (secs < 60) return 'just now';
    if (secs < 3600) return RTF.format(-Math.floor(secs / 60), 'minute');
    if (secs < 86400) return RTF.format(-Math.floor(secs / 3600), 'hour');
    return RTF.format(-Math.floor(secs / 86400), 'day');
  }
  function renderSyncNote() {
    // Only meaningful for a signed-in account that actually has WHOOP connected.
    if (me.kind !== 'user' || !me.whoop_connected) { whoopSync.hidden = true; return; }
    const when = me.whoop_last_synced_at ? relativeTime(me.whoop_last_synced_at) : null;
    whoopSync.textContent = when ? 'Synced ' + when : 'Not synced yet';
    whoopSync.hidden = false;
  }

  // ---- who is this? (a signed-in account, or a guest trying the app) -------
  let me = { kind: 'guest' };
  function renderWho() {
    who.textContent = '';
    if (me.kind === 'guest') {
      // Guests get no "User" field — just a way in.
      whoopbtn.textContent = 'Connect WHOOP';
      whoopbtn.onclick = () => askSignIn('connect your WHOOP');
      acctbtn.textContent = 'Log in';
      acctbtn.onclick = () => { location.href = '/login'; };
      renderSyncNote();
      return;
    }
    const name = document.createElement('b');
    name.className = 'live';
    name.textContent = me.name || 'Your account';   // textContent: never inject markup
    who.append(document.createTextNode('User: '), name);

    whoopbtn.textContent = me.whoop_connected ? 'Disconnect WHOOP' : 'Connect WHOOP';
    whoopbtn.onclick = me.whoop_connected
      ? async () => {
          if (!(await askConfirm('Disconnect WHOOP? Your already-synced data stays.',
                                 'Disconnect'))) return;
          await fetch('/whoop/disconnect', { method: 'POST' });
          location.reload();
        }
      : () => { location.href = '/whoop/connect'; };

    acctbtn.textContent = 'Log out';
    acctbtn.onclick = async () => {
      await fetch('/auth/logout', { method: 'POST' });
      clearChat();
      location.href = '/login';
    };
    renderSyncNote();
  }

  // quiet=true is used by the periodic background resync: it skips the loud
  // "Syncing…/✓ synced" chrome so the status bar doesn't flash every few
  // minutes, but still surfaces a dropped session (which needs the user to act).
  async function syncStatus(quiet) {
    if (me.kind === 'guest') {
      if (!quiet) statusEl.innerHTML = 'Exploring with sample data — nothing is saved. ' +
        '<a href="/login" style="color:var(--teal)">Create an account</a> to track your own.';
      return;
    }
    if (!me.whoop_connected) {
      if (!quiet) statusEl.innerHTML = 'WHOOP isn\'t connected — ' +
        '<a href="/whoop/connect" style="color:var(--teal)">connect it</a> ' +
        'to personalize advice with your recovery and sleep.';
      return;
    }
    if (!quiet) statusEl.textContent = 'Syncing WHOOP…';
    try {
      const r = await fetch('/whoop/sync');
      const d = await r.json();
      if (d.metrics_written != null) {
        // a successful pull moves the freshness note, quiet run or not
        if (d.last_synced_at) { me.whoop_last_synced_at = d.last_synced_at; renderSyncNote(); }
        if (!quiet) {
          statusEl.textContent = '✓ WHOOP synced — ' + d.metrics_written + ' metrics up to date';
          statusEl.className = 'ok';
          statusEl.style.opacity = '1';
          setTimeout(() => { statusEl.style.opacity = '0'; }, 4000);
        }
      } else {
        statusEl.className = '';
        statusEl.style.opacity = '1';
        statusEl.innerHTML = 'WHOOP session inactive — ' +
          '<a href="/whoop/connect" style="color:var(--teal)">reconnect to refresh your data</a>.';
      }
    } catch (e) { if (!quiet) statusEl.textContent = ''; }
  }

  // ---- boot ---------------------------------------------------------------
  function playWelcome() {
    const w = document.getElementById('welcome');
    w.classList.add('on');
    setTimeout(() => w.classList.remove('on'), 1900);
  }

  (async () => {
    try { me = await (await fetch('/me')).json(); } catch (e) {}
    if (me.kind === 'anon') { location.href = '/login'; return; }

    persist = me.kind === 'user';
    if (persist) {
      // Keep the thread id so the agent retains its context across reloads.
      threadId = localStorage.getItem('phs_thread');
      if (!threadId) {
        threadId = 'web-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('phs_thread', threadId);
      }
      history = loadHistory();
    } else {
      // Guest: a throwaway thread, and nothing touches localStorage. The upload
      // button stays visible — picking it explains why an account is needed
      // instead of the option simply not being there (writes 401 regardless).
      threadId = 'guest-' + Math.random().toString(36).slice(2, 10);
      clearChat();
    }

    renderWho();
    restoreChat();
    await syncStatus();
    if (bootParams.get('whoop') === 'mismatch') await resolveWhoopMismatch();
  })();

  // The user authorized a WHOOP account that isn't the one already connected.
  // Nothing has been changed server-side yet — replacing is destructive, so it
  // only happens on an explicit confirmation that states the cost.
  async function resolveWhoopMismatch() {
    let info = {};
    try { info = await (await fetch('/whoop/pending')).json(); } catch (e) {}
    if (!info.pending) return;

    const n = info.metrics_at_risk || 0, w = info.workouts_at_risk || 0;
    const ok = await askConfirm(
      'That WHOOP account is different from the one currently connected. ' +
      'Replacing it deletes the ' + n + ' metric' + (n === 1 ? '' : 's') + ' and ' +
      w + ' workout' + (w === 1 ? '' : 's') + ' already synced from the previous ' +
      'account, then pulls this account’s history instead. Bloodwork and your ' +
      'profile are unaffected.',
      'Replace');

    statusEl.style.opacity = '1';
    if (!ok) {
      await fetch('/whoop/pending/cancel', { method: 'POST' });
      statusEl.textContent = 'Kept your existing WHOOP connection.';
      statusEl.className = '';
      return;
    }
    statusEl.textContent = 'Replacing WHOOP data…';
    statusEl.className = '';
    try {
      const r = await (await fetch('/whoop/pending/replace', { method: 'POST' })).json();
      statusEl.textContent = '✓ Switched WHOOP account — ' +
        (r.metrics_written || 0) + ' metrics synced from the new one.';
      statusEl.className = 'ok';
      me = await (await fetch('/me')).json();
      renderWho();
    } catch (e) {
      statusEl.textContent = 'Could not switch accounts — please try again.';
    }
    setTimeout(() => { statusEl.style.opacity = '0'; }, 5000);
  }

  // Keep WHOOP data fresh: re-pull every 5 minutes while signed in and connected.
  // WHOOP's recovery/sleep/HRV update ~once a day, so this is generous; bump the
  // interval up if you want fewer calls. Skipped while the tab is hidden.
  const WHOOP_RESYNC_MS = 5 * 60 * 1000;
  setInterval(() => {
    if (me.kind === 'user' && me.whoop_connected && !document.hidden) syncStatus(true);
  }, WHOOP_RESYNC_MS);

  // Re-render the freshness note far more often than we re-sync, so "2 minutes
  // ago" keeps counting up between pulls. Pure local formatting — no requests.
  setInterval(renderSyncNote, 30 * 1000);

  // ---- the living orb ------------------------------------------------------
  // A sphere of wavy particle-like rings behind the chat, with two states:
  //   idle     — perfectly still, except one slow human breath (~1s in, ~1s
  //              out) every 15 seconds: alive, at rest.
  //   thinking — while the agent is composing a reply: rotating, undulating,
  //              continuously breathing.
  // Plain canvas 2D — no libraries, DPI-aware, breaths skip hidden tabs, and a
  // single static frame for users who prefer reduced motion.
  const orbCtl = (function () {
    const canvas = document.getElementById('orb');
    if (!canvas || !canvas.getContext) return { thinking: function () {} };
    const ctx = canvas.getContext('2d');
    let W, H;
    function fit() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', () => { fit(); if (mode === 'idle' && !raf) draw(pose, 1); });
    fit();

    // ring hues: theme teal leading, with the reference images' violet/blue behind
    const HUES = ['45,212,191', '56,189,248', '139,92,246', '45,212,191', '167,139,250'];

    // t sets the rings' pose (rotation/wobble); scale is the breath applied on top
    function draw(t, scale) {
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2;                       // dead centre of the viewport
      const R = Math.min(W, H) * 0.30 * scale;

      // ambient glow so the orb feels lit from within
      const g = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.7);
      g.addColorStop(0, 'rgba(45,212,191,0.10)');
      g.addColorStop(0.55, 'rgba(99,102,241,0.05)');
      g.addColorStop(1, 'rgba(15,23,32,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - R * 1.8, cy - R * 1.8, R * 3.6, R * 3.6);

      for (let i = 0; i < HUES.length; i++) {
        const dir = i % 2 ? -1 : 1;                        // alternate rotation
        const spin = t * 0.00012 * dir * (1 + i * 0.25);
        const wob = t * 0.0003;
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.05; a += 0.045) {
          const wave = 1                                   // layered waves -> organic edge
            + 0.055 * Math.sin(3 * a + spin * 9 + i * 1.7)
            + 0.035 * Math.sin(5 * a - wob + i * 2.3)
            + 0.020 * Math.sin(8 * a + wob * 1.6 + i);
          const r = R * wave * (0.86 + i * 0.05);
          const squash = 0.90 + 0.05 * Math.sin(spin * 5 + i);  // slight 3D tilt
          const x = cx + Math.cos(a + spin * 20) * r;
          const y = cy + Math.sin(a + spin * 20) * r * squash;
          a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(' + HUES[i] + ',' + (0.16 + 0.05 * Math.sin(t * 0.001 + i)) + ')';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    }

    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const BREATH_EVERY_MS = 15000;   // one breath each 15s at rest
    const BREATH_MS = 2000;          // ~1s in, ~1s out
    const BREATH_DEPTH = 0.06;       // how far the "chest" rises
    let mode = 'idle';
    let raf = null, breathTimer = null;
    let pose = 0;                    // the rings' pose; advances only while thinking

    function stopAnim() {
      if (raf) cancelAnimationFrame(raf);
      if (breathTimer) clearInterval(breathTimer);
      raf = breathTimer = null;
    }

    function breatheOnce() {         // a single human breath: inhale, exhale
      const t0 = performance.now();
      const step = (now) => {
        if (mode !== 'idle') return;                 // superseded by thinking
        const p = Math.min((now - t0) / BREATH_MS, 1);
        const env = Math.sin(Math.PI * p) ** 2;      // soft start, peak at 1s, soft end
        draw(pose, 1 + BREATH_DEPTH * env);
        raf = p < 1 ? requestAnimationFrame(step) : null;
      };
      raf = requestAnimationFrame(step);
    }

    function idle() {
      mode = 'idle';
      stopAnim();
      draw(pose, 1);                 // freeze wherever the thinking spin left off
      if (still) return;             // reduced motion: perfectly still, no breaths
      breathTimer = setInterval(() => {
        if (!document.hidden && !raf) breatheOnce();
      }, BREATH_EVERY_MS);
    }

    function think() {
      if (still || mode === 'thinking') return;
      mode = 'thinking';
      stopAnim();
      const start = performance.now(), from = pose;
      const loop = (now) => {
        if (mode !== 'thinking') return;
        pose = from + (now - start);
        draw(pose, 1 + 0.045 * Math.sin(pose * 0.00055));   // continuous live breath
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    }

    idle();   // paints the first frame synchronously, then rests
    return { thinking: (on) => (on ? think() : idle()) };
  })();

  // ---- render helpers -----------------------------------------------------
  function addUser(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    chat.appendChild(el);
  }
  function addBot() {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.textContent = 'Thinking…';
    chat.appendChild(el);
    return el;
  }
  function linkifyCitations(md, sources) {
    if (!sources || !sources.length) return md;
    const map = {};
    sources.forEach(s => { map[s.n] = s.url; });
    // turn [3] into a markdown link [[3]](url) so it renders as a clickable [3]
    return md.replace(/\[(\d+)\]/g, (m, n) => map[n] ? `[[${n}]](${map[n]})` : m);
  }
  function renderBot(el, data) {
    const md = linkifyCitations(data.answer || JSON.stringify(data), data.sources);
    el.innerHTML = marked.parse(md);
    el.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    if (data.sources && data.sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = 'sources: ' + data.sources
        .map(x => `<a href="${x.url}" target="_blank" rel="noopener">[${x.n}] ${x.title.slice(0,42)}${x.title.length>42?'…':''}</a>`)
        .join(' · ');
      chat.appendChild(s);
    }
    if (data.tools_used && data.tools_used.length) {
      const t = document.createElement('div');
      t.className = 'tools';
      t.innerHTML = 'used: ' + [...new Set(data.tools_used)].map(x => '<span>' + x + '</span>').join('');
      chat.appendChild(t);
    }
  }

  // ---- restore persisted transcript (signed-in users only; guests have none)
  function restoreChat() {
    if (!history.length) return;
    const hint = chat.querySelector('.hint');
    if (hint) hint.remove();
    history.forEach(m => {
      if (m.role === 'user') addUser(m.text);
      else renderBot(addBot(), m.data);
    });
    chat.scrollTop = chat.scrollHeight;
  }

  // ---- bloodwork: attach menu + upload manager ----------------------------
  const attachBtn = document.getElementById('attach');
  const attachMenu = document.getElementById('attach-menu');
  const bwModal = document.getElementById('bw-modal');
  const bwList = document.getElementById('bw-list');
  const bwMsg = document.getElementById('bw-msg');
  const bwFile = document.getElementById('bw-file');
  const bwSpinner = document.getElementById('bw-spinner');
  const SUPPORTED = ['pdf'];

  // toggle the menu; clicking the button again or anywhere outside closes it
  attachBtn.onclick = (e) => { e.stopPropagation(); attachMenu.hidden = !attachMenu.hidden; };
  document.addEventListener('click', (e) => {
    if (!attachMenu.hidden && !e.target.closest('.attach-wrap')) attachMenu.hidden = true;
  });

  document.getElementById('menu-add-bw').onclick = () => {
    attachMenu.hidden = true;
    if (me.kind !== 'user') return askSignIn('upload bloodwork');
    openBw();
  };
  document.getElementById('bw-close').onclick = () => { bwModal.hidden = true; };
  bwModal.addEventListener('click', (e) => { if (e.target === bwModal) bwModal.hidden = true; });
  document.getElementById('bw-add').onclick = () => bwFile.click();

  // Guests can read sample data but not write, so anything that would save
  // something explains why and offers a way in, rather than silently doing
  // nothing or jumping to the login page unannounced.
  const signinModal = document.getElementById('signin-modal');
  const signinText = document.getElementById('signin-text');
  function askSignIn(action) {
    signinText.textContent =
      'You’re trying PHS as a guest, so nothing you do here is saved. To ' +
      action + ' you’ll need an account — it only takes a moment, and your ' +
      'data stays yours.';
    signinModal.hidden = false;
  }
  document.getElementById('signin-cancel').onclick = () => { signinModal.hidden = true; };
  document.getElementById('signin-go').onclick = () => { location.href = '/login'; };
  signinModal.addEventListener('click', (e) => {
    if (e.target === signinModal) signinModal.hidden = true;
  });

  // in-app confirmation dialog (replaces the native window.confirm)
  const confirmModal = document.getElementById('confirm-modal');
  const confirmText = document.getElementById('confirm-text');
  const confirmOk = document.getElementById('confirm-ok');
  let confirmResolve = null;
  function closeConfirm(v) {
    confirmModal.hidden = true;
    if (confirmResolve) { confirmResolve(v); confirmResolve = null; }
  }
  confirmOk.onclick = () => closeConfirm(true);
  document.getElementById('confirm-cancel').onclick = () => closeConfirm(false);
  confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) closeConfirm(false); });
  function askConfirm(text, okLabel) {
    confirmText.textContent = text;
    confirmOk.textContent = okLabel || 'Delete';
    confirmModal.hidden = false;
    return new Promise(res => { confirmResolve = res; });
  }

  function bwSetMsg(text, kind) { bwMsg.textContent = text || ''; bwMsg.className = 'bw-msg' + (kind ? ' ' + kind : ''); }

  async function openBw() { bwSetMsg(''); bwModal.hidden = false; await loadBwDocs(); }

  async function loadBwDocs() {
    bwList.innerHTML = '<div class="bw-empty">Loading…</div>';
    let docs = [];
    try { docs = (await (await fetch('/bloodwork/documents')).json()).documents || []; } catch (e) {}
    bwList.innerHTML = '';
    if (!docs.length) { bwList.innerHTML = '<div class="bw-empty">No bloodwork uploaded yet.</div>'; return; }
    docs.forEach(d => bwList.appendChild(bwRow(d)));
  }

  function bwRow(d) {
    const row = document.createElement('div'); row.className = 'bw-item';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = d.name;
    const meta = document.createElement('span'); meta.className = 'meta';
    const n = d.metrics_count;
    meta.textContent = (d.report_date ? d.report_date + ' · ' : '') + n + (n === 1 ? ' value' : ' values');
    const edit = document.createElement('button');
    edit.className = 'edit'; edit.type = 'button'; edit.textContent = '✎'; edit.title = 'Rename';
    edit.onclick = () => bwRename(row, d);
    const del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.title = 'Delete';
    del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6">' +
      '</polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">' +
      '</path></svg>';
    del.onclick = async () => {
      if (!(await askConfirm('Delete "' + d.name + '" and its values?'))) return;
      try { await fetch('/bloodwork/documents/' + d.id, { method: 'DELETE' }); } catch (e) {}
      await loadBwDocs();
      bwSetMsg('Deleted "' + d.name + '".', '');
    };
    row.append(nm, meta, edit, del);
    return row;
  }

  function bwRename(row, d) {
    row.innerHTML = '';
    const inp = document.createElement('input');
    inp.className = 'rename'; inp.value = d.name; inp.maxLength = 80;
    row.appendChild(inp); inp.focus(); inp.select();
    let closed = false;
    const done = async (save) => {
      if (closed) return; closed = true;
      const name = inp.value.trim();
      if (save && name && name !== d.name) {
        try {
          await fetch('/bloodwork/documents/' + d.id, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
          d.name = name;
        } catch (e) {}
      }
      row.replaceWith(bwRow(d));
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') done(true); else if (e.key === 'Escape') done(false); };
    inp.onblur = () => done(true);
  }

  bwFile.onchange = async () => {
    const f = bwFile.files[0];
    if (!f) return;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!SUPPORTED.includes(ext)) {
      bwSetMsg('Please select a supported file. Supported: ' + SUPPORTED.join(', ').toUpperCase(), 'err');
      bwFile.value = ''; return;
    }
    bwSpinner.hidden = false;
    bwSetMsg('Uploading ' + f.name + '… this can take a few seconds.');
    const fd = new FormData(); fd.append('file', f); bwFile.value = '';
    try {
      const res = await fetch('/upload/bloodwork', { method: 'POST', body: fd });
      let d = null;
      try { d = await res.json(); } catch (e) {}
      if (d && d.status === 'ok') { bwSetMsg('Uploaded bloodwork!', 'ok'); await loadBwDocs(); }
      else if (d && d.message) { bwSetMsg(d.message, 'err'); }
      else { bwSetMsg('Upload failed — please try again.', 'err'); }
    } catch (e) {
      bwSetMsg('Upload failed — check your connection and try again.', 'err');
    } finally {
      bwSpinner.hidden = true;
    }
  };

  // ---- chat ---------------------------------------------------------------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    send.disabled = true;
    orbCtl.thinking(true);           // the orb comes alive while the agent works
    const hint = chat.querySelector('.hint');
    if (hint) hint.remove();
    addUser(q);
    history.push({ role: 'user', text: q }); saveHistory();
    const bot = addBot();
    chat.scrollTop = chat.scrollHeight;
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: q, thread_id: threadId })
      });
      const data = await res.json();
      renderBot(bot, data);
      history.push({ role: 'bot', data }); saveHistory();
    } catch (err) {
      bot.textContent = 'Error: ' + err;
      history.push({ role: 'bot', data: { answer: 'Error: ' + err } }); saveHistory();
    } finally {
      orbCtl.thinking(false);        // back to rest — answer or error alike
      send.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  });
</script>
</body>
</html>
