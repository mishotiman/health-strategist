<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Health Strategist</title>
<style>
  :root { --bg:#0f1720; --panel:#16212e; --line:#26333f; --teal:#2dd4bf; --ink:#e6edf3; --dim:#8aa0b2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--teal); }
  header .sub { color:var(--dim); font-size:12px; margin-left:auto; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:12px 15px; border-radius:12px; line-height:1.5; white-space:pre-wrap; max-width:88%; }
  .user { align-self:flex-end; background:#1f3a4d; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .tools { align-self:flex-start; font-size:11px; color:var(--dim); margin-top:-8px; }
  .tools span { background:#0d2b28; color:var(--teal); border-radius:6px; padding:2px 7px; margin-right:5px; }
  form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:15px; }
  input:focus { outline:none; border-color:var(--teal); }
  button { background:var(--teal); color:#04201c; border:none; border-radius:10px; padding:0 20px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:13px; text-align:center; margin:auto; max-width:520px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Personal Health Strategist</h1>
  <span class="sub">agentic RAG · WHOOP + bloodwork · cited</span>
</header>

<div id="chat">
  <div class="hint">Ask about your training, recovery, sleep, supplements, or bloodwork.<br>
  The agent reads your WHOOP + lab data and cites peer-reviewed research.</div>
</div>

<form id="form">
  <input id="input" autocomplete="off" placeholder="e.g. How's my recovery trending, and how should I train this week?" />
  <button id="send" type="submit">Send</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const threadId = 'web-' + Math.random().toString(36).slice(2, 10);
  const USER_ID = 1;

  function add(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    send.disabled = true;
    add('user', q);
    const thinking = add('bot', 'Thinking…');
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, message: q, thread_id: threadId })
      });
      const data = await res.json();
      thinking.textContent = data.answer || JSON.stringify(data);
      if (data.tools_used && data.tools_used.length) {
        const t = document.createElement('div');
        t.className = 'tools';
        t.innerHTML = 'used: ' + [...new Set(data.tools_used)].map(x => '<span>' + x + '</span>').join('');
        chat.appendChild(t);
      }
    } catch (err) {
      thinking.textContent = 'Error: ' + err;
    } finally {
      send.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  });
</script>
</body>
</html>
